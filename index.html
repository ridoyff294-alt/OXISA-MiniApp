<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>OXISA</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f8fb;
            color: #111827;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #16a34a;
        }

        /* Loading */

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        }

        .loading.error {
            color: #dc2626;
        }

        /* Main */

        .welcome {
            margin-bottom: 20px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .welcome h1 {
            font-size: 25px;
            font-weight: 750;
        }

        /* Balance */

        .balance-card {
            background: #111827;
            color: #ffffff;
            border-radius: 22px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .balance-label {
            color: #aeb7c5;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .balance {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .coin {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 5px;
        }

        /* Section */

        .section-title {
            font-size: 18px;
            font-weight: 750;
            margin: 24px 0 12px;
        }

        /* Earn Cards */

        .earn-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .earn-card h3 {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .earn-card p {
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Buttons */

        .button {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 13px;
            margin-top: 14px;
            background: #111827;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .button:active {
            transform: scale(0.98);
        }

    </style>

</head>


<body>

    <div class="app">

        <!-- Header -->

        <div class="header">

            <div class="brand">
                OXISA
            </div>

            <div class="status"></div>

        </div>


        <!-- Loading -->

        <div
            id="loading"
            class="loading"
        >
            Connecting to OXISA...
        </div>


        <!-- Main Content -->

        <div
            id="content"
            style="display: none;"
        >

            <!-- Welcome -->

            <div class="welcome">

                <p>
                    Welcome back
                </p>

                <h1 id="userName">
                    User
                </h1>

            </div>


            <!-- Balance -->

            <div class="balance-card">

                <div class="balance-label">
                    Available Balance
                </div>

                <div
                    class="balance"
                    id="balance"
                >
                    0
                </div>

                <div class="coin">
                    OXSA
                </div>

            </div>


            <!-- Earn -->

            <div class="section-title">
                Earn OXSA
            </div>


            <!-- Watch Ads -->

            <div class="earn-card">

                <h3>
                    Watch Ads
                </h3>

                <p>
                    Watch available advertisements
                    and earn OXSA.
                </p>

                <button
                    class="button"
                    type="button"
                    id="watchAdButton"
                >
                    Watch Ad
                </button>

            </div>


            <!-- Daily Claim -->

            <div class="earn-card">

                <h3>
                    Daily Claim
                </h3>

                <p>
                    Claim your daily OXSA reward
                    every 24 hours.
                </p>

                <button
                    class="button"
                    type="button"
                    id="dailyClaimButton"
                >
                    Claim 5 OXSA
                </button>

            </div>

        </div>

    </div>


    <!-- Telegram Initialization -->

    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();

        tg.expand();

    </script>


    <!-- OXISA Application JS -->

    <script
        src="app.js?v=20260914"
        defer
    ></script>


</body>

</html>
